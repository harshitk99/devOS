[project]
name = "devos-backend"
version = "0.1.0"
description = "DevOS controller: importer, doctor, planner, policy engine, sandbox, verification, rollback, audit"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "docker>=7.1",
  "anthropic>=1.0",
  "google-genai>=2.0",
  "pyyaml>=6",
  "psutil>=6.0",
  "gitpython>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_probes: run with the real environment probes (ports, databases) instead of stubs"]

[tool.ruff]
line-length = 100
