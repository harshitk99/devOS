[project]
name = "devos-cli"
version = "0.1.0"
description = "Terminal front end for DevOS: diagnose, plan, approve, run and verify from the command line"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
]

[project.scripts]
devos = "devos_cli.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["devos_cli*"]
