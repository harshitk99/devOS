# Infrastructure for DevOS itself (its own Postgres). The demo app has its own compose file.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: devos
      POSTGRES_PASSWORD: devos
      POSTGRES_DB: devos
    ports:
      - "5432:5432"
    volumes:
      - devos_pg:/var/lib/postgresql/data

volumes:
  devos_pg:
